    <!-- JavaScript Logic -->
    <script>
        // ==========================================
        // SUPABASE OPEN SOURCE CONFIGURATION
        // ==========================================
        const SUPABASE_URL = 'https://grpvarwtvbzeysmnrdko.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_2dSVWhC71ueYPPfvDzUogg_t2HopYbr';
        
        let supabaseClient = null;
        if (SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase) {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        // 1. Mobile Menu Toggle
<!-- ... existing code ... -->
        // 6. Admission Form Submission (Connected to Supabase)
        async function handleAdmissionSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('admSubmitBtn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>സമർപ്പിക്കുന്നു...</span>';

            const payload = {
                applicant_name: document.getElementById('admName').value.trim(),
                organization: document.getElementById('admOrg').value.trim(),
                phone: document.getElementById('admPhone').value.trim(),
                course_track: document.getElementById('trackSelect').value,
                notes: document.getElementById('admNotes').value.trim()
            };

            try {
                if (supabaseClient) {
                    const { error } = await supabaseClient.from('admissions').insert([payload]);
                    if (error) throw error;
                    showToast('നിങ്ങളുടെ അപേക്ഷ Supabase ഡാറ്റാബേസിൽ വിജയകരമായി രേഖപ്പെടുത്തി!');
                } else {
                    // Demo mode if Supabase keys are not added yet
                    console.log('Admission Data (Configure Supabase Keys to save live):', payload);
                    showToast('അപേക്ഷ സ്വീകരിച്ചു! (ലൈവ് ഡാറ്റയ്ക്ക് Supabase Keys ചേർക്കുക)');
                }
                e.target.reset();
            } catch (err) {
                console.error(err);
                showToast('ക്ഷമിക്കണം, സാങ്കേതിക തകരാർ സംഭവിച്ചു. വീണ്ടും ശ്രമിക്കുക.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        // 7. Student Login & Portfolio (Connected to Supabase Auth & DB)
        let currentUser = null;

        async function handleStudentLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPass').value;

            try {
                if (supabaseClient) {
                    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    currentUser = data.user;
                    document.getElementById('studentEmailDisplay').innerText = currentUser.email;
                    await loadStudentCertificates();
                } else {
                    document.getElementById('studentEmailDisplay').innerText = email + ' (Demo Mode)';
                }
                document.getElementById('studentLoginView').classList.add('hidden');
                document.getElementById('studentDashboardView').classList.remove('hidden');
                showToast('സ്റ്റുഡന്റ് പോർട്ടലിലേക്ക് സ്വാഗതം!');
            } catch (err) {
                showToast('ലോഗിൻ പരാജയപ്പെട്ടു: ' + (err.message || 'വിവരങ്ങൾ പരിശോധിക്കുക'));
            }
        }

        async function logoutStudent() {
            if (supabaseClient) {
                await supabaseClient.auth.signOut();
            }
            currentUser = null;
            document.getElementById('studentDashboardView').classList.add('hidden');
            document.getElementById('studentLoginView').classList.remove('hidden');
            showToast('ലോഗൗട്ട് ചെയ്തു.');
        }

        async function loadStudentCertificates() {
            if (!supabaseClient || !currentUser) return;
            const { data, error } = await supabaseClient
                .from('certificates')
                .select('*')
                .eq('student_email', currentUser.email);

            if (!error && data) {
                const list = document.getElementById('studentCertList');
                list.innerHTML = data.length === 0 ? '<p class="text-xs text-slate-400">സർട്ടിഫിക്കറ്റുകൾ ഒന്നും ചേർത്തിട്ടില്ല.</p>' : '';
                data.forEach(item => {
                    list.innerHTML += `
                        <div class="p-3 bg-white border border-slate-200 rounded-xl flex justify-between items-center text-xs">
                            <div>
                                <p class="font-bold text-slate-900">${item.course_title}</p>
                                <p class="text-slate-500">ID: ${item.credential_id}</p>
                            </div>
                            <span class="px-2 py-1 bg-emerald-100 text-emerald-800 rounded-md font-semibold">Saved</span>
                        </div>
                    `;
                });
            }
        }

        async function addStudentCert() {
            const title = document.getElementById('newCertTitle').value.trim();
            const id = document.getElementById('newCertId').value.trim();
            if (!title || !id) {
                showToast('ദയവായി കോഴ്സിന്റെ പേരും ID-യും നൽകുക.');
                return;
            }

            try {
                if (supabaseClient && currentUser) {
                    const { error } = await supabaseClient.from('certificates').insert([{
                        student_email: currentUser.email,
                        course_title: title,
                        credential_id: id
                    }]);
                    if (error) throw error;
                    await loadStudentCertificates();
                } else {
                    const list = document.getElementById('studentCertList');
                    list.innerHTML += `
                        <div class="p-3 bg-white border border-slate-200 rounded-xl flex justify-between items-center text-xs">
                            <div>
                                <p class="font-bold text-slate-900">${title}</p>
                                <p class="text-slate-500">ID / Link: ${id}</p>
                            </div>
                            <span class="px-2 py-1 bg-amber-100 text-amber-800 rounded-md font-semibold">Added</span>
                        </div>
                    `;
                }
                document.getElementById('newCertTitle').value = '';
                document.getElementById('newCertId').value = '';
                showToast('സർട്ടിഫിക്കറ്റ് ലിങ്ക് ഡാറ്റാബേസിൽ സേവ് ചെയ്തു!');
            } catch (err) {
                showToast('സേവ് ചെയ്യുന്നതിൽ പിശക് സംഭവിച്ചു.');
            }
        }

        // 8. Certificate Verification Logic (Connected to Supabase DB)
        function verifySpecificId(id) {
            openModal('verifyModal');
            document.getElementById('verifyInput').value = id;
            runVerification();
        }

        async function runVerification() {
            const input = document.getElementById('verifyInput').value.trim();
            const resultBox = document.getElementById('verifyResult');
            resultBox.classList.remove('hidden');

            if (!input) return;

            if (supabaseClient) {
                const { data, error } = await supabaseClient
                    .from('certificates')
                    .select('*')
                    .ilike('credential_id', input)
                    .single();

                if (!error && data) {
                    resultBox.className = 'p-4 rounded-2xl text-xs bg-emerald-50 border border-emerald-300 text-emerald-950 space-y-1';
                    resultBox.innerHTML = `
                        <div class="flex items-center gap-2 font-bold text-emerald-800 text-sm">
                            <i class="fa-solid fa-circle-check text-emerald-600"></i>
                            <span>ആധികാരിക സർട്ടിഫിക്കറ്റ് (Verified)</span>
                        </div>
                        <p><strong>കോഴ്സ്:</strong> ${data.course_title}</p>
                        <p><strong>ID:</strong> ${data.credential_id}</p>
                    `;
                    return;
                }
            }

            if (input.toUpperCase() === 'HIKMA-DEMO-01') {
                resultBox.className = 'p-4 rounded-2xl text-xs bg-emerald-50 border border-emerald-300 text-emerald-950 space-y-1';
                resultBox.innerHTML = `
                    <div class="flex items-center gap-2 font-bold text-emerald-800 text-sm">
                        <i class="fa-solid fa-circle-check text-emerald-600"></i>
                        <span>ആധികാരിക സർട്ടിഫിക്കറ്റ് (Verified Sample)</span>
                    </div>
                    <p><strong>കോഴ്സ്:</strong> AL-HIKMAH (BAYAN Diploma Track)</p>
                    <p><strong>പദവി:</strong> Successfully Completed</p>
                    <p><strong>ID:</strong> ${input.toUpperCase()}</p>
                `;
            } else {
                resultBox.className = 'p-4 rounded-2xl text-xs bg-red-50 border border-red-200 text-red-900';
                resultBox.innerHTML = `
                    <div class="flex items-center gap-2 font-bold text-red-700">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <span>ഈ നമ്പറിൽ രേഖകൾ കണ്ടെത്താനായില്ല. നമ്പർ ഒരിക്കൽ കൂടി പരിശോധിക്കുക.</span>
                    </div>
                `;
            }
        }
    </script>
